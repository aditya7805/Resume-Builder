<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder with Auth & OTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f3f6;
      --panel: #ffffff;
      --border: #d9dee5;
      --accent: #2563eb;
      --text: #1f2933;
      --ra: #262626;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- Auth Modal ---------- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.hidden { display: none; }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-form.hidden { display: none; }

    .auth-form h2 { font-size: 1.5rem; color: #1e293b; text-align: center; }
    .auth-form .subtitle { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 8px; }

    .password-group {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-group input { padding-right: 40px; }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password:hover { background: none; }

    .eye-icon {
      width: 20px;
      height: 20px;
      fill: #64748b;
    }

    .auth-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-btn:hover { opacity: 0.95; }

    .switch-mode { font-size: 0.85rem; text-align: center; color: #64748b; }
    .switch-mode a { color: var(--accent); text-decoration: none; font-weight: 600; }

    .success-msg {
      font-size: 0.8rem;
      color: #15803d;
      background: #dcfce7;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .success-msg.visible { display: block; }

    .error-msg {
      font-size: 0.75rem;
      color: #b91c1c;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 { font-size: 1.25rem; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    input[type="color"] {
      width: 36px; height: 34px; padding: 2px;
      border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer;
    }

    button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #eef2f7; }
    #pdfBtn { background: var(--accent); color: #fff; border-color: var(--accent); }
    .logout-btn { background: #fecaca; color: #991b1b; border-color: #fca5a5; }

    /* ---------- Layout & Inputs ---------- */
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 20px;
      padding: 20px 24px;
      align-items: start;
    }

    .form-panel { display: flex; flex-direction: column; gap: 14px; }

    fieldset {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    legend { font-weight: 600; padding: 0 6px; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    input.invalid { border-color: #b91c1c; outline-color: #b91c1c; }

    input[type="text"], input[type="email"], input[type="tel"], input[type="password"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    textarea { resize: vertical; }

    .entry {
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .entry .remove {
      align-self: flex-end;
      color: #b91c1c;
      border-color: #fecaca;
      padding: 4px 10px;
      font-size: 0.8rem;
    }
    .add { align-self: flex-start; }

    /* ---------- Resume Preview ---------- */
    .preview-panel { overflow-x: auto; }

    .resume {
      position: relative;
      width: 794px;
      min-height: 1120px;
      margin: 0 auto;
      background: #fff;
      padding: 72px 79px 90px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      font-family: "Lexend", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: #2b2b2b;
    }
    .resume.exporting { box-shadow: none; margin: 0; }

    .resume header {
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--ra);
    }
    .resume h1 {
      font-size: 40px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ra);
    }
    .resume .role {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .resume .contact {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      margin-top: 22px;
      font-size: 13px;
      font-weight: 300;
      color: #555;
    }
    .resume .contact span { display: inline-flex; align-items: center; gap: 8px; }
    .resume .contact svg { 
      width: 16px !important; height: 16px !important; 
      fill: var(--ra); flex: none; 
    }

    .resume section {
      padding: 18px 0 16px;
      border-bottom: 1.5px solid var(--ra);
    }
    .resume section:last-of-type { border-bottom: none; }

    .resume h2 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ra);
      margin-bottom: 8px;
    }
    .resume p { white-space: pre-line; font-weight: 300; }

    .resume .item { margin-bottom: 12px; }
    .resume .item-meta { color: #666; font-size: 14px; font-weight: 300; }
    .resume .item-title { font-weight: 700; font-size: 15px; }

    .resume .skill-list {
      list-style: disc;
      padding-left: 22px;
      column-count: 3;
      column-gap: 30px;
      font-weight: 300;
    }
    .resume .skill-list li { break-inside: avoid; }

    .resume .footer-bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 30px;
      background: color-mix(in srgb, var(--ra) 70%, white);
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- AUTH MODAL -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <h2>Sign In</h2>
        <p class="subtitle">Log in to manage and build your resume</p>

        <div class="input-group">
          <input type="email" id="loginEmail" placeholder="Email address" required>
        </div>

        <div class="input-group password-group">
          <input type="password" id="loginPassword" placeholder="Password" required>
          <button type="button" class="toggle-password" data-target="loginPassword">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>

        <span id="loginError" class="error-msg"></span>
        <button type="submit" class="auth-btn">Sign In</button>
        <p class="switch-mode">Don't have an account? <a href="#" id="toRegister">Create Account</a></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join to save and edit your resumes</p>

        <div class="input-group">
          <input type="text" id="regName" placeholder="Full Name" required>
        </div>

        <div class="input-group">
          <input type="email" id="regEmail" placeholder="Email address" required>
        </div>

        <div class="input-group password-group">
          <input type="password" id="regPassword" placeholder="Password" required>
          <button type="button" class="toggle-password" data-target="regPassword">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>

        <div class="input-group password-group">
          <input type="password" id="regConfirmPassword" placeholder="Re-enter Password" required>
          <button type="button" class="toggle-password" data-target="regConfirmPassword">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>

        <span id="authSuccess" class="success-msg"></span>
        <span id="authError" class="error-msg"></span>

        <button type="submit" class="auth-btn">Register & Verify Email</button>
        <p class="switch-mode">Already have an account? <a href="#" id="toLogin">Sign In</a></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <header class="topbar">
    <h1>Resume Builder</h1>
    <div class="actions">
      <label for="wallpaper">Wallpaper:</label>
      <input type="color" id="wallpaper" value="#f1f3f6" title="Background colour">
      <label for="accent">Resume colour:</label>
      <input type="color" id="accent" value="#262626" title="Accent colour">
      <button id="loadSample" type="button">Load Sample</button>
      <button id="clearAll" type="button">Clear</button>
      <button id="pdfBtn" type="button">Download PDF</button>
      <button id="logoutBtn" type="button" class="logout-btn">Log Out</button>
    </div>
  </header>

  <main class="layout">
    <!-- FORM -->
    <section class="form-panel" id="formPanel">
      <fieldset>
        <legend>Personal Details</legend>
        <input type="text" id="name" placeholder="Full name">
        <input type="text" id="title" placeholder="Job title (e.g. Professional Accountant)">
        
        <div class="input-group">
          <input type="tel" id="phone" placeholder="Phone (numbers, +, -, spaces only)">
          <span id="phoneError" class="error-msg"></span>
        </div>

        <div class="input-group">
          <input type="email" id="email" placeholder="Email">
          <span id="emailError" class="error-msg"></span>
        </div>

        <input type="text" id="location" placeholder="Address / City">

        <div class="input-group">
          <input type="text" id="link" placeholder="Website / LinkedIn (optional)">
          <span id="linkError" class="error-msg"></span>
        </div>
      </fieldset>

      <fieldset>
        <legend>About Me</legend>
        <textarea id="summary" rows="4" placeholder="Short professional summary"></textarea>
      </fieldset>

      <fieldset>
        <legend>Education</legend>
        <div id="educationList"></div>
        <button type="button" class="add" data-add="education">+ Add education</button>
      </fieldset>

      <fieldset>
        <legend>Work Experience</legend>
        <div id="experienceList"></div>
        <button type="button" class="add" data-add="experience">+ Add experience</button>
      </fieldset>

      <fieldset>
        <legend>Skills</legend>
        <input type="text" id="skills" placeholder="Comma separated: Auditing, Financial Reporting, Excel">
      </fieldset>
    </section>

    <!-- PREVIEW -->
    <section class="preview-panel">
      <div id="resume" class="resume"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const STORAGE_KEY = "resumeBuilderData_v2";
      const USER_KEY = "resumeBuilderUser_v1";

      // Password Visibility Toggle Logic
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          if (input) {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            btn.style.opacity = isPassword ? "0.6" : "1";
          }
        });
      });

      // Authentication Switcher
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const authModal = document.getElementById("authModal");
      const authError = document.getElementById("authError");
      const loginError = document.getElementById("loginError");
      const authSuccess = document.getElementById("authSuccess");

      const toRegisterBtn = document.getElementById("toRegister");
      const toLoginBtn = document.getElementById("toLogin");

      if (toRegisterBtn) {
        toRegisterBtn.addEventListener("click", (e) => {
          e.preventDefault();
          loginForm.classList.add("hidden");
          registerForm.classList.remove("hidden");
          authError.classList.remove("visible");
          authSuccess.classList.remove("visible");
        });
      }

      if (toLoginBtn) {
        toLoginBtn.addEventListener("click", (e) => {
          e.preventDefault();
          registerForm.classList.add("hidden");
          loginForm.classList.remove("hidden");
          loginError.classList.remove("visible");
        });
      }

      // Helper to completely clear the resume input form
      function resetResumeForm() {
        data = emptyData();
        SIMPLE_FIELDS.forEach((id) => {
          const el = $(id);
          if (el) el.value = "";
        });
        const eduList = $("educationList");
        const expList = $("experienceList");
        if (eduList) eduList.innerHTML = "";
        if (expList) expList.innerHTML = "";
        update();
      }

      // Register Submit Handler with Duplicate Check & OTP Verification Flow
      registerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const pass = document.getElementById("regPassword").value;
        const confirmPass = document.getElementById("regConfirmPassword").value;

        if (pass !== confirmPass) {
          authError.textContent = "Error: Passwords do not match!";
          authError.classList.add("visible");
          authSuccess.classList.remove("visible");
          return;
        }

        const existingUsers = JSON.parse(localStorage.getItem(USER_KEY + "_all") || "[]");
        const userExists = existingUsers.some(u => u.email === email);

        if (userExists) {
          authError.textContent = "Error: An account with this email already exists! Please sign in.";
          authError.classList.add("visible");
          authSuccess.classList.remove("visible");
          return;
        }

        // Simulate OTP Generation and Verification
        const generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        alert(`[Simulated Email Verification]\nYour One-Time Password (OTP) for ${email} is: ${generatedOtp}`);

        const userEnteredOtp = prompt("Please enter the 4-digit OTP sent to your email address to complete verification:");
        if (userEnteredOtp !== generatedOtp) {
          authError.textContent = "Error: Incorrect OTP entered. Account creation aborted.";
          authError.classList.add("visible");
          authSuccess.classList.remove("visible");
          return;
        }

        const newUser = { name, email, pass };
        existingUsers.push(newUser);
        localStorage.setItem(USER_KEY + "_all", JSON.stringify(existingUsers));
        localStorage.setItem(USER_KEY, JSON.stringify(newUser));

        // Populate name & email directly into the resume inputs
        data.name = name;
        data.email = email;
        if ($("name")) $("name").value = name;
        if ($("email")) $("email").value = email;

        // Show success message
        authSuccess.textContent = `Account created & email verified successfully! Welcome, ${name}.`;
        authSuccess.classList.add("visible");
        authError.classList.remove("visible");

        update();

        // Auto close modal after a short delay
        setTimeout(() => {
          authModal.classList.add("hidden");
          registerForm.reset();
          authSuccess.classList.remove("visible");
        }, 1200);
      });

      // Login Submit Handler
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPassword").value;
        const existingUsers = JSON.parse(localStorage.getItem(USER_KEY + "_all") || "[]");
        
        const foundUser = existingUsers.find(u => u.email === email && u.pass === pass);

        if (foundUser) {
          localStorage.setItem(USER_KEY, JSON.stringify(foundUser));
          authModal.classList.add("hidden");
          loginError.classList.remove("visible");
        } else {
          loginError.textContent = "Error: Invalid email or password!";
          loginError.classList.add("visible");
        }
      });

      // Logout Handler
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          authModal.classList.remove("hidden");
        });
      }

      // Resume Builder Logic
      const SECTIONS = {
        education: {
          list: "educationList",
          fields: [
            ["school", "College / University"],
            ["period", "Years (e.g. 2022-2026)"],
            ["degree", "Degree / Course"],
            ["details", "Details", "textarea"],
          ],
        },
        experience: {
          list: "experienceList",
          fields: [
            ["company", "Company"],
            ["period", "Years (e.g. 2024 - 2025)"],
            ["role", "Job title"],
            ["details", "What you did", "textarea"],
          ],
        },
      };

      const SAMPLE = {
        name: "Aditya Sharma",
        title: "Front-End Developer",
        phone: "+91 98765 43210",
        email: "aditya@example.com",
        location: "Hyderabad, India",
        link: "https://linkedin.com/in/aditya",
        summary: "Final-year Computer Science student passionate about web interfaces.",
        education: [{ school: "XYZ Tech", period: "2022-2026", degree: "B.Tech CSE", details: "CGPA: 8.4" }],
        experience: [{ company: "ABC Tech", period: "2025", role: "Intern", details: "Built web pages." }],
        skills: "HTML, CSS, JavaScript, React",
      };

      const emptyData = () => ({
        wallpaper: "#f1f3f6", accent: "#262626",
        name: "", title: "", phone: "", email: "", location: "", link: "",
        summary: "", education: [], experience: [], skills: "",
      });

      let data = load();

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return saved ? { ...emptyData(), ...saved } : emptyData();
        } catch (e) { return emptyData(); }
      }
      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }

      const $ = (id) => document.getElementById(id);
      function esc(str) {
        return String(str ?? "").replace(/[&<>"']/g, (c) => (
          { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
        ));
      }

      const SIMPLE_FIELDS = ["name", "title", "phone", "email", "location", "link", "summary", "skills"];

      const ICONS = {
        phone: '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>',
        email: '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
        location: '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
        link: '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>',
      };

      function validatePhone(val) {
        const el = $("phone"), err = $("phoneError");
        if (!el || !err) return true;
        if (/[a-zA-Z]/.test(val || "")) {
          el.classList.add("invalid"); err.textContent = "Error: Phone cannot contain letters.";
          err.classList.add("visible"); return false;
        }
        el.classList.remove("invalid"); err.classList.remove("visible"); return true;
      }

      function validateEmail(val) {
        const el = $("email"), err = $("emailError");
        if (!el || !err) return true;
        const trimmed = (val || "").trim();
        if (trimmed !== "" && !trimmed.includes("@")) {
          el.classList.add("invalid"); err.textContent = "Error: Email must contain '@'.";
          err.classList.add("visible"); return false;
        }
        el.classList.remove("invalid"); err.classList.remove("visible"); return true;
      }

      function validateUrl(val) {
        const el = $("link"), err = $("linkError");
        if (!el || !err) return true;
        const trimmed = (val || "").trim();
        if (trimmed === "") { el.classList.remove("invalid"); err.classList.remove("visible"); return true; }
        let testVal = /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
        try {
          const url = new URL(testVal);
          if (!url.hostname.includes(".") || /\s/.test(trimmed)) throw new Error();
          el.classList.remove("invalid"); err.classList.remove("visible"); return true;
        } catch (e) {
          el.classList.add("invalid"); err.textContent = "Error: Invalid URL.";
          err.classList.add("visible"); return false;
        }
      }

      function buildEntry(section, index, entry) {
        const cfg = SECTIONS[section];
        const wrap = document.createElement("div");
        wrap.className = "entry";

        cfg.fields.forEach(([key, placeholder, type]) => {
          const input = document.createElement(type === "textarea" ? "textarea" : "input");
          if (type === "textarea") input.rows = 3; else input.type = "text";
          input.placeholder = placeholder;
          input.value = entry[key] || "";
          input.addEventListener("input", () => {
            data[section][index][key] = input.value;
            update();
          });
          wrap.appendChild(input);
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          data[section].splice(index, 1);
          renderLists();
          update();
        });
        wrap.appendChild(remove);
        return wrap;
      }

      function renderLists() {
        Object.keys(SECTIONS).forEach((section) => {
          const container = $(SECTIONS[section].list);
          if (container) {
            container.innerHTML = "";
            data[section].forEach((entry, i) => container.appendChild(buildEntry(section, i, entry)));
          }
        });
      }

      function itemsHtml(section, metaKey, titleKey) {
        return data[section]
          .filter((e) => Object.values(e).some((v) => String(v).trim()))
          .map((e) => {
            const meta = [e[metaKey], e.period].filter((x) => x && x.trim()).map(esc).join(" | ");
            const details = (e.details || "").trim();
            return `
              <div class="item">
                ${meta ? `<div class="item-meta">${meta}</div>` : ""}
                ${e[titleKey] ? `<div class="item-title">${esc(e[titleKey])}</div>` : ""}
                ${details ? `<p>${esc(details)}</p>` : ""}
              </div>`;
          })
          .join("");
      }

      function render() {
        const resumeEl = $("resume");
        if (!resumeEl) return;

        const phoneVal = validatePhone(data.phone) ? data.phone : "";
        const emailVal = validateEmail(data.email) ? data.email : "";
        const linkVal = validateUrl(data.link) ? data.link : "";

        const contactItems = [
          ["phone", phoneVal], ["email", emailVal],
          ["location", data.location], ["link", linkVal],
        ]
          .filter(([, v]) => v && v.trim())
          .map(([icon, v]) => `<span>${ICONS[icon]}${esc(v)}</span>`)
          .join('<span style="color: #bbb; margin: 0 4px;">•</span>');

        const skills = data.skills.split(",").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("");

        const hasAnything = data.name || data.title || data.summary || skills || contactItems ||
          data.education.length || data.experience.length;

        resumeEl.className = "resume";
        resumeEl.innerHTML = hasAnything
          ? `
            <header>
              <h1>${esc(data.name) || "Your Name"}</h1>
              ${data.title ? `<div class="role">${esc(data.title)}</div>` : ""}
              ${contactItems ? `<div class="contact">${contactItems}</div>` : ""}
            </header>
            ${data.summary.trim() ? `<section><h2>About Me</h2><p>${esc(data.summary)}</p></section>` : ""}
            ${itemsHtml("education", "school", "degree") ? `<section><h2>Education</h2>${itemsHtml("education", "school", "degree")}</section>` : ""}
            ${itemsHtml("experience", "company", "role") ? `<section><h2>Work Experience</h2>${itemsHtml("experience", "company", "role")}</section>` : ""}
            ${skills ? `<section><h2>Skills</h2><ul class="skill-list">${skills}</ul></section>` : ""}
            <div class="footer-bar"></div>
          `
          : `<p class="empty" style="text-align: center; color: #9aa5b1; font-style: italic; margin-top: 40px;">Start filling the form on the left, or click "Load Sample" to see an example.</p>`;
      }

      function update() {
        document.body.style.background = data.wallpaper;
        if ($("resume")) $("resume").style.setProperty("--ra", data.accent);
        render(); save();
      }

      SIMPLE_FIELDS.forEach((id) => {
        const el = $(id);
        if (el) {
          el.addEventListener("input", (e) => {
            data[id] = e.target.value;
            if (id === "phone") validatePhone(e.target.value);
            if (id === "email") validateEmail(e.target.value);
            if (id === "link") validateUrl(e.target.value);
            update();
          });
        }
      });

      $("wallpaper").addEventListener("input", (e) => { data.wallpaper = e.target.value; update(); });
      $("accent").addEventListener("input", (e) => { data.accent = e.target.value; update(); });

      document.querySelectorAll("[data-add]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const section = btn.dataset.add;
          const blank = {};
          SECTIONS[section].fields.forEach(([key]) => (blank[key] = ""));
          data[section].push(blank);
          renderLists();
          update();
        });
      });

      $("loadSample").addEventListener("click", () => {
        data = { ...JSON.parse(JSON.stringify(SAMPLE)), wallpaper: data.wallpaper, accent: data.accent };
        SIMPLE_FIELDS.forEach(id => { if ($(id)) $(id).value = data[id] || ""; });
        renderLists();
        update();
      });

      $("clearAll").addEventListener("click", () => {
        if (confirm("Clear all data?")) {
          resetResumeForm();
        }
      });

      function fileName() {
        const base = (data.name || "resume").trim().replace(/[^\w\-]+/g, "_");
        return `${base}_Resume.pdf`;
      }

      function downloadPdf() {
        const isPhoneValid = validatePhone(data.phone);
        const isEmailValid = validateEmail(data.email);
        const isUrlValid = validateUrl(data.link);

        if (!isPhoneValid) {
          alert("Please fix the error in the phone number before downloading the PDF.");
          $("phone").focus();
          return;
        }
        if (!isEmailValid) {
          alert("Please fix the error in the email address before downloading the PDF.");
          $("email").focus();
          return;
        }
        if (!isUrlValid) {
          alert("Please fix the error in the website URL before downloading the PDF.");
          $("link").focus();
          return;
        }

        const el = $("resume");
        if (!el) return;
        if (typeof html2pdf === "undefined") {
          alert("PDF library could not load. Opening print dialog instead.");
          window.print();
          return;
        }

        const btn = $("pdfBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Creating PDF...";
        }
        el.classList.add("exporting");

        const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();

        fontsReady
          .then(() =>
            html2pdf()
              .set({
                margin: 0,
                filename: fileName(),
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff", scrollY: 0 },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
              })
              .from(el)
              .save()
          )
          .catch((err) => { console.error(err); alert("Could not create the PDF. Please try again."); })
          .finally(() => {
            el.classList.remove("exporting");
            if (btn) {
              btn.disabled = false;
              btn.textContent = "Download PDF";
            }
          });
      }

      const pdfBtn = $("pdfBtn");
      if (pdfBtn) {
        pdfBtn.addEventListener("click", downloadPdf);
      }

      // Initial fill form check
      SIMPLE_FIELDS.forEach(id => { if ($(id)) $(id).value = data[id] || ""; });
      renderLists();
      update();
    });
  </script>
</body>
</html>
